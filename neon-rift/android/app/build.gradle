plugins {
    id 'com.android.application'
}


def verifyUrl = providers.gradleProperty('PURCHASE_VERIFY_URL').getOrElse('')
def expectedSigningCert = providers.gradleProperty('BYMEL_SIGNING_CERT_SHA256').getOrElse('')
def requirePlayInstaller = providers.gradleProperty('REQUIRE_PLAY_INSTALLER').getOrElse('false').toBoolean()
def allowUnpinnedRelease = providers.gradleProperty('ALLOW_UNPINNED_RELEASE').getOrElse('false').toBoolean()

def criticalAssetPaths = [
        'index.html',
        'css/game.css',
        'js/config.js',
        'js/core.js',
        'js/audio.js',
        'js/billing.js',
        'js/game.js',
        'vendor/three.min.js'
]

def gameRoot = file('../../game')
def assetDigest = java.security.MessageDigest.getInstance('SHA-256')
criticalAssetPaths.sort().each { relativePath ->
    def asset = new File(gameRoot, relativePath)
    if (!asset.isFile()) throw new GradleException("Eksik kritik oyun dosyası: ${relativePath}")
    assetDigest.update(relativePath.getBytes('UTF-8'))
    assetDigest.update((byte) 0)
    asset.withInputStream { stream ->
        byte[] buffer = new byte[16384]
        int read
        while ((read = stream.read(buffer)) != -1) assetDigest.update(buffer, 0, read)
    }
}
def gameAssetSha256 = assetDigest.digest().collect { String.format('%02X', it) }.join('')

android {
    namespace 'com.bymel.Neonrift'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bymel.Neonrift'
        minSdk 23
        targetSdk 36
        versionCode 14
        versionName '1.3.1'
        buildConfigField 'String', 'PURCHASE_VERIFY_URL', '"' + verifyUrl.replace('"', '\\"') + '"'
        buildConfigField 'String', 'EXPECTED_SIGNING_CERT_SHA256', '"' + expectedSigningCert.replaceAll('[^A-Fa-f0-9]', '').toUpperCase() + '"'
        buildConfigField 'String', 'GAME_ASSET_SHA256', '"' + gameAssetSha256 + '"'
        buildConfigField 'boolean', 'REQUIRE_PLAY_INSTALLER', requirePlayInstaller.toString()
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (System.getenv('BYMEL_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('BYMEL_KEYSTORE_FILE'))
                storePassword System.getenv('BYMEL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BYMEL_KEY_ALIAS')
                keyPassword System.getenv('BYMEL_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            buildConfigField 'boolean', 'REQUIRE_SERVER_VERIFICATION', 'false'
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            buildConfigField 'boolean', 'REQUIRE_SERVER_VERIFICATION', 'true'
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs = ['src/main/assets', '../../game']
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any { task -> task.project == project && task.name.toLowerCase().contains('release') }
    if (releaseRequested && !allowUnpinnedRelease && expectedSigningCert.replaceAll('[^A-Fa-f0-9]', '').length() != 64) {
        throw new GradleException('Release için BYMEL_SIGNING_CERT_SHA256 Gradle özelliğine 64 haneli SHA-256 yayın sertifikası parmak izi girilmelidir. Geçici olarak atlamak için ALLOW_UNPINNED_RELEASE=true kullanılabilir; mağaza yayını için önerilmez.')
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
}
