org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Play Billing 9.x AndroidX bağımlılıkları getirdiği için zorunlu.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Üretim satın alma doğrulama endpoint'i. Servis hesabı sırrını uygulamaya koymayın.
PURCHASE_VERIFY_URL=

# Google Play App Signing sertifikasının 64 haneli SHA-256 değeri.
# Ayraçlar (: veya boşluk) kullanılabilir; derleme normalize eder.
BYMEL_SIGNING_CERT_SHA256=

# true yapılırsa release yalnızca Google Play kurulumunu kabul eder.
REQUIRE_PLAY_INSTALLER=false

# Sadece geçici yerel test. Mağaza release'i için false bırakın.
ALLOW_UNPINNED_RELEASE=false
