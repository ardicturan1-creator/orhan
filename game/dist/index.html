<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Drift</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0a0715; overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; }
  * { box-sizing:border-box; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }

  #hud { position:fixed; top:0; left:0; right:0; padding:env(safe-area-inset-top,14px) 18px 0 18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; opacity:0; transition:opacity .3s; }
  #hud.visible { opacity:1; }
  .scoreWrap { color:#eaf6ff; }
  #score { font-size:34px; font-weight:800; letter-spacing:1px; text-shadow:0 0 12px #4fe0ff, 0 0 2px #fff; }
  #combo { font-size:14px; color:#ffd24f; text-shadow:0 0 8px #ffb300; margin-top:2px; }
  .bestWrap { text-align:right; color:#9fd8ff; font-size:13px; }
  #bestHud { font-size:18px; font-weight:700; color:#fff; }
  #shieldIcon { width:30px; height:30px; margin-top:6px; margin-left:auto; border-radius:50%; border:2px solid rgba(79,224,255,.35); display:flex; align-items:center; justify-content:center; color:rgba(79,224,255,.35); font-size:16px; transition:.2s; }
  #shieldIcon.on { border-color:#4fe0ff; color:#4fe0ff; box-shadow:0 0 14px #4fe0ff; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .35s; background:radial-gradient(circle at 50% 35%, rgba(40,20,70,.55), rgba(6,4,14,.92) 70%); }
  .screen.visible { opacity:1; pointer-events:auto; }
  .title { font-size:44px; font-weight:900; letter-spacing:2px; color:#fff; text-shadow:0 0 18px #ff4fd6, 0 0 36px #4fe0ff; margin:0 0 6px 0; }
  .subtitle { color:#b9c4ff; font-size:14px; margin-bottom:26px; line-height:1.6; max-width:320px; }
  .btn { pointer-events:auto; background:linear-gradient(135deg,#4fe0ff,#8a5cff); color:#0a0715; font-weight:800; font-size:20px; padding:16px 46px; border-radius:50px; border:none; box-shadow:0 0 24px rgba(79,224,255,.55), 0 6px 0 rgba(0,0,0,.25); letter-spacing:1px; }
  .btn:active { transform:translateY(3px); box-shadow:0 0 18px rgba(79,224,255,.5), 0 2px 0 rgba(0,0,0,.25); }
  .statRow { display:flex; gap:34px; margin-bottom:22px; }
  .statBox { color:#eaf6ff; }
  .statBox .n { font-size:30px; font-weight:800; }
  .statBox .l { font-size:11px; color:#9fd8ff; letter-spacing:1px; text-transform:uppercase; }
  #newBest { display:none; color:#ffd24f; font-weight:800; margin-bottom:14px; text-shadow:0 0 10px #ffb300; letter-spacing:1px; }

  #flash { position:fixed; inset:0; background:#ff3d3d; opacity:0; pointer-events:none; mix-blend-mode:screen; }
  #errBox { position:fixed; left:10px; right:10px; bottom:10px; background:rgba(20,10,30,.9); color:#ffb3b3; font-size:12px; padding:10px; border-radius:8px; display:none; z-index:99; white-space:pre-wrap; }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="scoreWrap">
      <div id="score">0</div>
      <div id="combo">x1</div>
    </div>
    <div class="bestWrap">
      EN İYİ
      <div id="bestHud">0</div>
      <div id="shieldIcon">🛡</div>
    </div>
  </div>

  <div id="menuScreen" class="screen">
    <div class="title">NEON DRIFT</div>
    <div class="subtitle">Kaydırarak şerit değiştir, dokunarak zıpla.<br>Engellerden kaç, kristalleri topla, hızlan!</div>
    <button id="startBtn" class="btn">OYNA</button>
  </div>

  <div id="overScreen" class="screen">
    <div class="title" style="font-size:32px;">OYUN BİTTİ</div>
    <div id="newBest">🏆 YENİ REKOR!</div>
    <div class="statRow">
      <div class="statBox"><div class="n" id="finalScore">0</div><div class="l">Skor</div></div>
      <div class="statBox"><div class="n" id="bestScore">0</div><div class="l">En İyi</div></div>
    </div>
    <button id="retryBtn" class="btn">TEKRAR OYNA</button>
  </div>

  <div id="flash"></div>
  <div id="errBox"></div>

  <script src="game.js"></script>
</body>
</html>
