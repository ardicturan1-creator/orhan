name: Build Nobet Hatti APK

# Trigger nudge for workflow discovery.
on:
  push:
    branches:
      - claude/apk-derleme-6bwbik
    paths:
      - 'nobet-hatti/**'
      - '.github/workflows/nobet-hatti-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nobet-hatti
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: nobet-hatti/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: nobet-hatti/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nobet-hatti-debug-apk
          path: nobet-hatti/android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nobet-hatti-apk-${{ github.run_number }}
          name: Nobet Hatti debug APK (build ${{ github.run_number }})
          body: |
            Otomatik olarak GitHub Actions ile derlenen Nöbet Hattı debug APK dosyası.
            Bu bir debug derlemesidir (debug imzası ile imzalanmıştır); Play Store yayını için release derlemesi gereklidir.
            AdMob henüz yapılandırılmadı (yer tutucu banner gösterir) — bkz. TESLIMAT_REHBERI.md.
          prerelease: true
          files: nobet-hatti/android/app/build/outputs/apk/debug/*.apk
