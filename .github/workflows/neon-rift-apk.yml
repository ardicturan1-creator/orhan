name: Build Neon Rift APK

on:
  push:
    branches:
      - claude/apk-derleme-6bwbik
    paths:
      - 'neon-rift/**'
      - '.github/workflows/neon-rift-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-rift/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rift-debug-apk
          path: neon-rift/android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neon-rift-apk-${{ github.run_number }}
          name: Neon Rift debug APK (build ${{ github.run_number }})
          body: |
            Otomatik olarak GitHub Actions ile derlenen Neon Rift debug APK dosyası.
            Bu bir debug derlemesidir (debug imzası ile imzalanmıştır); Play Store yayını için release derlemesi gereklidir.
          prerelease: true
          files: neon-rift/android/app/build/outputs/apk/debug/*.apk
