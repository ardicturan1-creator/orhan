name: Build EXE

on:
  push:
    branches:
      - "claude/chrome-opener-exe-hpvfj1"
    paths:
      - "chrome_opener.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --noconsole --name chrome_opener chrome_opener.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome_opener-exe
          path: dist/chrome_opener.exe
          if-no-files-found: error
