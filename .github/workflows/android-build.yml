name: Android APK Build (Twin Soccer)

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "twin-soccer/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "twin-soccer/**"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: twin-soccer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: twin-soccer/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web bundle
        run: npm run build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build signed debug APK
        working-directory: twin-soccer/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK
        working-directory: twin-soccer/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: twin-soccer-debug-apk
          path: twin-soccer/android/app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: twin-soccer-release-apk
          path: twin-soccer/android/app/build/outputs/apk/release/*.apk

      - name: Publish APKs as a GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Twin Soccer APK (latest build)"
          body: |
            Automatically built from commit ${{ github.sha }}.
            Both APKs are signed and installable on any Android device (minSdk 22+).
          make_latest: true
          files: |
            twin-soccer/android/app/build/outputs/apk/debug/*.apk
            twin-soccer/android/app/build/outputs/apk/release/*.apk
