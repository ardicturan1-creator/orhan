name: Android APK Build (Twin Soccer)

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "twin-soccer/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "twin-soccer/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: twin-soccer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: twin-soccer/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web bundle
        run: npm run build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK (installable on any device, no signing required)
        working-directory: twin-soccer/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build unsigned release APK (smaller, optimized)
        working-directory: twin-soccer/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: twin-soccer-debug-apk
          path: twin-soccer/android/app/build/outputs/apk/debug/*.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: twin-soccer-release-unsigned-apk
          path: twin-soccer/android/app/build/outputs/apk/release/*.apk
