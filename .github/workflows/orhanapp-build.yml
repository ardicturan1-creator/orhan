name: APK Derle

on:
  push:
    paths:
      - 'OrhanApp/**'
      - '.github/workflows/orhanapp-build.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: OrhanApp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle önbelleği kur
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew çalıştırılabilir yap
        run: chmod +x ./gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: orhan-debug-apk
          path: OrhanApp/app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı GitHub Release'e ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "orhanapp-debug-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "OrhanApp Debug APK (run ${{ github.run_number }})" \
            --notes "Otomatik debug APK derlemesi (workflow run ${{ github.run_id }})." \
            --prerelease
